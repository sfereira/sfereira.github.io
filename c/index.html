<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src https://cardvault-share.cardvault-share.workers.dev http://127.0.0.1:8788; base-uri 'none'; form-action 'none'">
<title>Contact · CardVault</title>
<!--
  The contact lives only in the URL fragment (#...), which browsers never send to the server.
  It is a raw-DEFLATE, base64url vCard made by CardVault. No network requests, cookies or storage.
  The card photo never leaves the sharer's phone, so the card is drawn from the shared details
  using CardVault's card styling (VaultTheme / BusinessCardSidesView).
-->
<style>
  :root {
    color-scheme: light dark;
    --accent: #007aff;
    --bg: #f8f5f0;            /* VaultTheme.background, light */
    --surface: #ffffff;       /* secondarySystemGroupedBackground, light */
    --text: #000000;
    --muted: rgba(60, 60, 67, 0.6);
    --line: rgba(60, 60, 67, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #0a84ff;
      --bg: #131312;          /* VaultTheme.background, dark */
      --surface: #1c1c1e;
      --text: #ffffff;
      --muted: rgba(235, 235, 245, 0.6);
      --line: rgba(84, 84, 88, 0.6);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 460px; margin: 0 auto; display: grid; gap: 22px; }
  .status { text-align: center; color: var(--muted); margin: 0; min-height: 1.4em; font-size: 15px; }

  /* Grouped section, as in About contact. */
  .group { background: var(--surface); border-radius: 26px; padding: 20px; }
  .hdr { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0 0 8px 20px; }

  /* Card face: white, 10pt continuous corner, 0.7pt hairline, soft drop shadow. */
  .biz {
    container-type: inline-size;
    aspect-ratio: 1.75;               /* standard 3.5 × 2 in business card */
    background: #fff; color: #111;
    border-radius: 10px;
    box-shadow: 0 0 0 0.7px rgba(0, 0, 0, 0.12), 0 5px 14px rgba(0, 0, 0, 0.10);
    padding: 7.5cqw 7.5cqw 6.5cqw;
    display: flex; flex-direction: column; justify-content: space-between; gap: 4cqw;
    overflow: hidden;
  }
  .biz p { margin: 0; overflow-wrap: anywhere; }
  .biz-name { font-weight: 700; font-size: 7.4cqw; line-height: 1.15; letter-spacing: -0.01em;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .biz-line { font-size: 4.5cqw; line-height: 1.35; margin-top: 0.6cqw !important;
              display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .biz-name + .biz-line { margin-top: 2.2cqw !important; }
  .biz-contact .biz-line { font-size: 4cqw; }
  /* The sender's real card photo replaces the drawn face once it has been decrypted. */
  .biz-photo { display: block; width: 100%; height: auto; border-radius: 10px;
               box-shadow: 0 0 0 0.7px rgba(0, 0, 0, 0.12), 0 5px 14px rgba(0, 0, 0, 0.10);
               background: #fff; animation: appear 0.25s ease-out; }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .biz-photo { animation: none; } }
  .photo-note { margin: 12px 4px 0; font-size: 13px; color: var(--muted); }

  /* About rows, matching the app's label-over-value list. */
  .rows { margin: 0; padding: 0; list-style: none; }
  .rows li { padding: 12px 0; border-bottom: 0.5px solid var(--line); overflow-wrap: anywhere; }
  .rows li:last-child { border-bottom: 0; padding-bottom: 0; }
  .rows li:first-child { padding-top: 0; }
  .rows .name { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .rows span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
  .rows a { color: var(--accent); text-decoration: none; }

  button { appearance: none; border: 0; border-radius: 14px; min-height: 52px; width: 100%;
           font: inherit; font-weight: 600; cursor: pointer; }
  .primary { background: var(--accent); color: #fff; }
  .link { background: none; color: var(--accent); min-height: 44px; font-weight: 500; margin-top: 4px; }
  [hidden] { display: none !important; }
  .foot { text-align: center; font-size: 13px; color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <p class="status" id="status" role="status" aria-live="polite">Opening CardVault…</p>
  <section class="group" id="cardGroup" hidden>
    <div class="biz" id="biz" role="img">
      <div aria-hidden="true">
        <p class="biz-name" id="bizName"></p>
        <p class="biz-line" id="bizTitle"></p>
        <p class="biz-line" id="bizOrg"></p>
      </div>
      <div class="biz-contact" id="bizContact" aria-hidden="true"></div>
    </div>
    <p class="photo-note" id="photoNote" hidden></p>
  </section>
  <!-- The one action stays directly under the card, above the fold on small phones. -->
  <div id="actions" hidden>
    <button class="primary" id="save" type="button">Add to Contacts</button>
    <button class="link" id="open" type="button">Open in CardVault</button>
  </div>
  <section id="aboutGroup" hidden>
    <h2 class="hdr">About</h2>
    <div class="group"><ul class="rows" id="rows"></ul></div>
  </section>
  <p class="foot">Shared with CardVault. Contact details stay on this device.</p>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const token = location.hash.slice(1);
  // The whole fragment is passed on, so CardVault also receives the card photo reference.
  const appURL = "cardvault://import#" + token;
  const [contactToken, photoPart] = token.split("~");
  // Card-photo relay (Cloudflare Worker). Set after deployment; a local server is used only
  // when this page itself is served from 127.0.0.1 for testing.
  const PRODUCTION_API = "https://cardvault-share.cardvault-share.workers.dev";
  const PHOTO_API = location.hostname === "127.0.0.1"
    ? (new URLSearchParams(location.search).get("api") || "") : PRODUCTION_API;
  let vcard = "";
  let name = "Contact";

  function fail(message) { $("status").textContent = message; $("actions").hidden = true; }

  async function decode(value) {
    if (!/^1\.[A-Za-z0-9_-]+$/.test(value) || value.length > 4096) throw new Error("format");
    let b64 = value.slice(2).replace(/-/g, "+").replace(/_/g, "/");
    b64 += "=".repeat((4 - b64.length % 4) % 4);
    const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    const text = await new Response(stream).text();
    if (!/^BEGIN:VCARD/i.test(text.trim()) || text.length > 16384) throw new Error("content");
    return text;
  }

  // Minimal vCard 3.0 reading for display only; the file itself is passed on unchanged.
  function fields(text) {
    const unfolded = text.replace(/\r?\n[ \t]/g, "");
    const out = {};
    for (const line of unfolded.split(/\r?\n/)) {
      const i = line.indexOf(":");
      if (i < 0) continue;
      const head = line.slice(0, i).toUpperCase();
      const key = head.split(";")[0];
      const value = line.slice(i + 1).replace(/\\n/gi, " ").replace(/\\([,;\\])/g, "$1").trim();
      if (!value) continue;
      if (key === "URL" && /TYPE=LINKEDIN/.test(head)) { (out.LINKEDIN = out.LINKEDIN || []).push(value); continue; }
      (out[key] = out[key] || []).push(value);
    }
    return out;
  }

  function text(el, value) { el.textContent = value || ""; el.hidden = !value; }

  function line(parent, value) {
    const p = document.createElement("p");
    p.className = "biz-line";
    p.textContent = value;
    parent.append(p);
  }

  function row(label, value, href) {
    const li = document.createElement("li");
    const span = document.createElement("span");
    span.textContent = label;
    const content = href ? Object.assign(document.createElement("a"), { href }) : document.createElement("div");
    content.textContent = value;
    li.append(span, content);
    $("rows").append(li);
  }

  function render(vcardText) {
    const f = fields(vcardText);
    const first = (k) => (f[k] && f[k][0]) || "";
    name = first("FN") || "Contact";
    const title = first("TITLE"), org = first("ORG").replace(/;+$/, "");
    const email = first("EMAIL"), phone = first("TEL");
    const site = (f.URL || [])[0] || "";

    // Card face: same hierarchy as a printed card — name, role, company, then contact lines.
    text($("bizName"), name);
    text($("bizTitle"), title);
    text($("bizOrg"), org);
    for (const value of [email, phone, site.replace(/^https?:\/\//i, "")].filter(Boolean)) line($("bizContact"), value);
    $("biz").setAttribute("aria-label", "Business card: " + [name, title, org, email, phone].filter(Boolean).join(", "));

    // About rows mirror CardVault's About contact list.
    const li = document.createElement("li");
    li.className = "name";
    li.textContent = name;
    $("rows").append(li);
    if (title) row("Role", title);
    if (org) row("Company", org);
    for (const v of f.EMAIL || []) row("Email", v, "mailto:" + v);
    for (const v of f.TEL || []) row("Phone", v, "tel:" + v.replace(/[^\d+]/g, ""));
    for (const v of f.URL || []) if (/^https?:\/\//i.test(v)) row("Website", v, v);
    for (const v of f.LINKEDIN || []) if (/^https?:\/\//i.test(v)) row("LinkedIn", v, v);
    if (first("ADR")) row("Address", first("ADR").split(";").filter(Boolean).join(", "));

    $("cardGroup").hidden = false;
    $("aboutGroup").hidden = false;
    document.title = name + " · CardVault";
  }

  function showFallback() {
    if (document.hidden) return;
    $("status").textContent = "Save this contact to your phone.";
    $("actions").hidden = false;
  }

  function tryApp() {
    $("status").textContent = "Opening CardVault…";
    // When CardVault is installed iOS offers to open it and this page goes to the background.
    // Otherwise nothing opens, and the Contacts fallback appears.
    location.href = appURL;
    setTimeout(showFallback, 1600);
  }

  $("save").addEventListener("click", () => {
    const file = new File([vcard], name.replace(/[\/\\:?%*|"<>]/g, "") + ".vcf", { type: "text/vcard" });
    location.href = URL.createObjectURL(file);
  });
  $("open").addEventListener("click", tryApp);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && vcard) setTimeout(showFallback, 300);
  });

  function fromBase64URL(value) {
    let b64 = value.replace(/-/g, "+").replace(/_/g, "/");
    b64 += "=".repeat((4 - b64.length % 4) % 4);
    return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  }

  // Downloads the encrypted photo and decrypts it here with the key from the fragment.
  async function showCardPhoto() {
    const match = /^([A-Za-z0-9_-]{22})\.([A-Za-z0-9_-]{43})$/.exec(photoPart || "");
    if (!match || !PHOTO_API) return;
    const note = $("photoNote");
    try {
      const response = await fetch(`${PHOTO_API}/v1/cards/${match[1]}`, { cache: "no-store", referrerPolicy: "no-referrer" });
      if (response.status === 404) throw new Error("expired");
      if (!response.ok) throw new Error("unavailable");
      const sealed = new Uint8Array(await response.arrayBuffer());
      const key = await crypto.subtle.importKey("raw", fromBase64URL(match[2]), "AES-GCM", false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: sealed.slice(0, 12) }, key, sealed.slice(12));
      const img = new Image();
      img.className = "biz-photo";
      img.alt = "Business card photo for " + name;
      img.src = URL.createObjectURL(new Blob([plain], { type: "image/jpeg" }));
      await img.decode();
      $("biz").replaceWith(img);
    } catch (error) {
      note.textContent = error.message === "expired"
        ? "The card photo has expired. The contact details are still here."
        : "The card photo couldn’t be loaded. The contact details are still here.";
      note.hidden = false;
    }
  }

  decode(contactToken).then((value) => {
    vcard = value;
    render(value);
    showCardPhoto();
    tryApp();
  }).catch(() => fail("This contact link is incomplete. Ask for the QR code again."));
})();
</script>
</body>
</html>
